[package]
name = "kroniki_launcher"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
eframe = "0.36.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
zip = "2"
chrono = { version = "0.4", features = ["clock"] }


name: Kroniki RPG - Windows Preview Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select unique preview version
        id: version
        run: |
          $base = (Select-String -Path rust-core/Cargo.toml -Pattern '^version = "([0-9.]+)"$').Matches[0].Groups[1].Value
          $version = "$base-preview.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-core
            launcher
      - name: Test Core and updater
        run: |
          cargo test --manifest-path rust-core/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Rust Core tests failed' }
          cargo test --manifest-path launcher/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Launcher tests failed' }
      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build committed source
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/build_windows_release.ps1 -Version $env:RELEASE_VERSION -Channel preview -Repository $env:GITHUB_REPOSITORY -SourceSha $env:GITHUB_SHA
      - name: Verify installer and update persistence
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/test_windows_update.ps1 -Version $env:RELEASE_VERSION -SourceSha $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/KronikiRPG-Setup.exe
            build/KronikiRPG-win-x64.zip
            build/update-manifest.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build-windows
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build-windows.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          m = json.loads(pathlib.Path('update-manifest.json').read_text(encoding='utf-8-sig'))
          package = pathlib.Path('KronikiRPG-win-x64.zip')
          assert m['version'] == os.environ['RELEASE_VERSION']
          assert m['source_sha'] == os.environ['SOURCE_SHA']
          assert m['channel'] == 'preview'
          assert m['package_size'] == package.stat().st_size
          assert m['sha256'] == hashlib.sha256(package.read_bytes()).hexdigest()
          assert m['package_url'] == f"https://github.com/{os.environ['GH_REPO']}/releases/download/v{m['version']}/{package.name}"
          PY
          tag="v$RELEASE_VERSION"
          # Draft hides incomplete uploads from launchers. Existing tags/assets are never overwritten.
          gh release create "$tag" KronikiRPG-Setup.exe KronikiRPG-win-x64.zip update-manifest.json \
            --target "$SOURCE_SHA" --title "Kroniki RPG $RELEASE_VERSION" \
            --notes "Preview built and tested from commit $SOURCE_SHA." --prerelease --draft
          gh release edit "$tag" --draft=false --prerelease --latest=false

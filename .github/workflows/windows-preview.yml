name: Kroniki RPG - Windows Preview Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
            'ci/bin/head00.bin',
            'ci/bin/head01.bin',
            'ci/bin/rest00.bin',
            'ci/bin/rest01.bin',
            'ci/bin/rest02.bin',
            'ci/bin/rest03.bin',
            'ci/bin/rest04.bin',
            'ci/bin/rest05.bin',
            'ci/bin/rest06.bin',
            'ci/bin/rest07.bin'
          )
          $out = [IO.File]::Create((Join-Path $PWD 'source.tar.xz'))
          try {
            foreach ($p in $parts) {
              if (!(Test-Path $p)) { throw "Missing source fragment: $p" }
              $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD $p))
              $out.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $out.Dispose()
          }
          $size = (Get-Item 'source.tar.xz').Length
          if ($size -ne 33684) { throw "Unexpected source archive size: $size" }
          $sha = (Get-FileHash 'source.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'd8f2dba574f7975e872a88719090298321aaf4ef860ecd7ab0e1eae341eebccc') {
            throw "Source archive SHA256 mismatch: $sha"
          }
          tar -xJf source.tar.xz
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed.' }
          if (!(Test-Path 'kroniki-rpg-godot/scripts/build_windows_release.ps1')) {
            throw 'Source archive reconstruction failed.'
          }

      - name: Patch Inno Setup path in build script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'kroniki-rpg-godot/scripts/build_windows_release.ps1'
          $src = Get-Content $path -Raw
          $src = $src.Replace('"$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"', '"${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"')
          Set-Content -Path $path -Value $src -Encoding utf8

      - name: Patch launcher for eframe 0.36
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'kroniki-rpg-godot/launcher/src/main.rs'
          $src = Get-Content $path -Raw
          $src = $src.Replace(
            'fn update(&mut self, ctx: &egui::Context, _frame: &mut eframe::Frame) {',
            'fn ui(&mut self, ui: &mut egui::Ui, _frame: &mut eframe::Frame) {'
          )
          $src = $src.Replace(
            'ctx.request_repaint_after(Duration::from_millis(100));',
            'ui.ctx().request_repaint_after(Duration::from_millis(100));'
          )
          $src = $src.Replace(
            'egui::CentralPanel::default().show(ctx, |ui| {',
            'egui::CentralPanel::default().show(ui, |ui| {'
          )
          Set-Content -Path $path -Value $src -Encoding utf8

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kroniki-rpg-godot/rust-core
            kroniki-rpg-godot/launcher

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6',
            'C:\Program Files\Inno Setup 6'
          )
          $inno = $candidates | Where-Object { Test-Path (Join-Path $_ 'ISCC.exe') } | Select-Object -First 1
          if (!$inno) { throw 'Inno Setup installed but ISCC.exe was not found.' }
          $inno | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Inno Setup: $inno"

      - name: Build game, launcher and installer
        shell: pwsh
        working-directory: kroniki-rpg-godot
        run: |
          ./scripts/build_windows_release.ps1 -Version '0.8.1-preview.1' -Channel 'preview' -Repository 'Vizyer/kroniki-rpg' -GodotVersion '4.7.2'

      - name: Verify outputs
        shell: pwsh
        working-directory: kroniki-rpg-godot
        run: |
          $required = @(
            'build/KronikiRPG-Setup.exe',
            'build/KronikiRPG-win-x64.zip',
            'build/update-manifest.json',
            'build/KronikiLauncher.exe',
            'build/app/KronikiRPG.exe',
            'build/app/kroniki_core.exe'
          )
          foreach ($p in $required) {
            if (!(Test-Path $p)) { throw "Missing build output: $p" }
          }
          Get-FileHash build/KronikiRPG-Setup.exe -Algorithm SHA256
          Get-ChildItem build -Recurse | Select-Object FullName,Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: KronikiRPG-0.8.1-preview.1-Windows
          path: |
            kroniki-rpg-godot/build/KronikiRPG-Setup.exe
            kroniki-rpg-godot/build/KronikiRPG-win-x64.zip
            kroniki-rpg-godot/build/update-manifest.json
          if-no-files-found: error
          retention-days: 30

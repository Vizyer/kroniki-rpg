name: Kroniki RPG - Windows Preview Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
            'ci/bin/head00.bin',
            'ci/bin/head01.bin',
            'ci/bin/rest00.bin',
            'ci/bin/rest01.bin',
            'ci/bin/rest02.bin',
            'ci/bin/rest03.bin',
            'ci/bin/rest04.bin',
            'ci/bin/rest05.bin',
            'ci/bin/rest06.bin',
            'ci/bin/rest07.bin'
          )
          $out = [IO.File]::Create((Join-Path $PWD 'source.tar.xz'))
          try {
            foreach ($p in $parts) {
              if (!(Test-Path $p)) { throw "Missing source fragment: $p" }
              $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD $p))
              $out.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $out.Dispose()
          }
          $size = (Get-Item 'source.tar.xz').Length
          if ($size -ne 33684) { throw "Unexpected source archive size: $size" }
          $sha = (Get-FileHash 'source.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'd8f2dba574f7975e872a88719090298321aaf4ef860ecd7ab0e1eae341eebccc') {
            throw "Source archive SHA256 mismatch: $sha"
          }
          tar -xJf source.tar.xz
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed.' }
          if (!(Test-Path 'kroniki-rpg-godot/scripts/build_windows_release.ps1')) {
            throw 'Source archive reconstruction failed.'
          }

      - name: Apply 0.9 Core + AI-GM overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $b64 = ''
          foreach ($p in @('ci/overlay09/p0.b64','ci/overlay09/p1.b64','ci/overlay09/p2.b64','ci/overlay09/p3.b64')) {
            if (!(Test-Path $p)) { throw "Missing 0.9 overlay fragment: $p" }
            $b64 += (Get-Content $p -Raw).Trim()
          }
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes((Join-Path $PWD 'overlay-0.9.tar.xz'), $bytes)
          $size = (Get-Item 'overlay-0.9.tar.xz').Length
          if ($size -ne 28524) { throw "Unexpected 0.9 overlay size: $size" }
          $sha = (Get-FileHash 'overlay-0.9.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '348b7761cdfab42b70f7c5626df5df3dbe66a5bfe1fa66bd2a06c2b1d59084be') {
            throw "0.9 overlay SHA256 mismatch: $sha"
          }
          tar -xJf overlay-0.9.tar.xz -C kroniki-rpg-godot
          if ($LASTEXITCODE -ne 0) { throw '0.9 overlay extraction failed.' }
          $required = @(
            'kroniki-rpg-godot/rust-core/src/systems.rs',
            'kroniki-rpg-godot/rust-core/src/ai.rs',
            'kroniki-rpg-godot/godot/scripts/main.gd'
          )
          foreach ($p in $required) { if (!(Test-Path $p)) { throw "Overlay missing: $p" } }

      - name: Fix 0.9 Rust compile issues
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $systems = 'kroniki-rpg-godot/rust-core/src/systems.rs'
          $src = Get-Content $systems -Raw
          $src = $src.Replace('let out=apply_ai_patch(s,p);', 'let out=apply_ai_patch(s,&p);')
          Set-Content -Path $systems -Value $src -Encoding utf8

          $main = 'kroniki-rpg-godot/rust-core/src/main.rs'
          $src = Get-Content $main -Raw
          $src = $src.Replace(
            'async fn ai_config_set(State(s):State<AppState>,Json(p):Json<Value>)->Json<Value>{let c=s.db.lock().unwrap();',
            'async fn ai_config_set(State(s):State<AppState>,Json(p):Json<Value>)->Json<Value>{{let c=s.db.lock().unwrap();'
          )
          $src = $src.Replace('drop(c);ai_config_get(State(s)).await}', '}ai_config_get(State(s)).await}')
          Set-Content -Path $main -Value $src -Encoding utf8

          $gd = 'kroniki-rpg-godot/godot/scripts/main.gd'
          $gsrc = Get-Content $gd -Raw
          $gsrc = $gsrc.Replace(
            '    var total:=state.world.hour*60+state.world.minute+mins; state.world.day+=int(total/1440); total%=1440; state.world.hour=int(total/60); state.world.minute=total%60; _update_status()',
            '    var total:int = int(state.world.hour) * 60 + int(state.world.minute) + mins; state.world.day += int(total / 1440); total %= 1440; state.world.hour = int(total / 60); state.world.minute = total % 60; _update_status()'
          )
          Set-Content -Path $gd -Value $gsrc -Encoding utf8

      - name: Patch save UI and persistence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patchB64 = ''
          $patchPath = Join-Path $env:RUNNER_TEMP 'patch_save.py'
          [IO.File]::WriteAllBytes($patchPath, [Convert]::FromBase64String($patchB64))
          python $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Save patch script failed.' }

      - name: Patch Godot export to wait for process completion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'kroniki-rpg-godot/scripts/build_windows_release.ps1'
          $src = Get-Content $path -Raw
          $oldImport = '& $Godot --headless --editor --quit'
          $newImport = "& `$Godot --headless --editor --quit`r`nGet-Process -Name ([IO.Path]::GetFileNameWithoutExtension(`$Godot)) -ErrorAction SilentlyContinue | Wait-Process"
          $oldExport = "& `$Godot --headless --export-release 'Windows Desktop' (Join-Path `$App 'KronikiRPG.exe')"
          $newExport = "& `$Godot --headless --export-release 'Windows Desktop' (Join-Path `$App 'KronikiRPG.exe')`r`nGet-Process -Name ([IO.Path]::GetFileNameWithoutExtension(`$Godot)) -ErrorAction SilentlyContinue | Wait-Process"
          if (-not $src.Contains($oldImport)) { throw 'Godot import command not found.' }
          if (-not $src.Contains($oldExport)) { throw 'Godot export command not found.' }
          $src = $src.Replace($oldImport,$newImport).Replace($oldExport,$newExport)
          $src = $src.Replace("Pop-Location", "Pop-Location`r`nif (!(Test-Path (Join-Path `$App 'KronikiRPG.exe'))) { throw 'Godot export finished without KronikiRPG.exe' }")
          Set-Content -Path $path -Value $src -Encoding utf8
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kroniki-rpg-godot/rust-core
            kroniki-rpg-godot/launcher

      - name: Test Rust Core
        shell: pwsh
        run: |
          cargo test --manifest-path kroniki-rpg-godot/rust-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust Core tests failed.' }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6',
            'C:\Program Files\Inno Setup 6'
          )
          $inno = $candidates | Where-Object { Test-Path (Join-Path $_ 'ISCC.exe') } | Select-Object -First 1
          if (!$inno) { throw 'Inno Setup installed but ISCC.exe was not found.' }
          $inno | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Inno Setup: $inno"

      - name: Build game, launcher and installer
        shell: pwsh
        working-directory: kroniki-rpg-godot
        run: |
          ./scripts/build_windows_release.ps1 -Version '0.9.0-preview.2' -Channel 'preview' -Repository 'Vizyer/kroniki-rpg' -GodotVersion '4.7.2'

      - name: Verify outputs
        shell: pwsh
        working-directory: kroniki-rpg-godot
        run: |
          $required = @(
            'build/KronikiRPG-Setup.exe',
            'build/KronikiRPG-win-x64.zip',
            'build/update-manifest.json',
            'build/KronikiLauncher.exe',
            'build/app/KronikiRPG.exe',
            'build/app/kroniki_core.exe'
          )
          foreach ($p in $required) {
            if (!(Test-Path $p)) { throw "Missing build output: $p" }
          }
          Get-FileHash build/KronikiRPG-Setup.exe -Algorithm SHA256
          Get-ChildItem build -Recurse | Select-Object FullName,Length

      - name: Smoke test installed game and save persistence
        shell: pwsh
        working-directory: kroniki-rpg-godot
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'KronikiRPG-Smoke'
          $dataDir = Join-Path $env:LOCALAPPDATA 'KronikiRPG'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          if (Test-Path $dataDir) { Remove-Item -Recurse -Force $dataDir }

          Write-Host '==> Silent installer test'
          $setup = (Resolve-Path 'build/KronikiRPG-Setup.exe').Path
          $p = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }

          $launcher = Join-Path $installDir 'KronikiLauncher.exe'
          $game = Join-Path $installDir 'app/KronikiRPG.exe'
          $core = Join-Path $installDir 'app/kroniki_core.exe'
          foreach ($required in @($launcher,$game,$core)) {
            if (!(Test-Path $required)) { throw "Installed file missing: $required" }
          }

          function Wait-Core {
            for ($i=0; $i -lt 60; $i++) {
              try {
                $h = Invoke-RestMethod -Uri 'http://127.0.0.1:17377/health' -TimeoutSec 1
                if ($h.ok) { return }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            throw 'Rust Core did not become healthy.'
          }

          function Start-Core {
            $proc = Start-Process -FilePath $core -WorkingDirectory (Split-Path $core) -PassThru
            Wait-Core
            return $proc
          }

          function Stop-Core {
            try {
              Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/shutdown' -ContentType 'application/json' -Body '{}' -TimeoutSec 3 | Out-Null
            } catch {}
            Start-Sleep -Milliseconds 700
          }

          Write-Host '==> Save -> shutdown -> restart -> load'
          $coreProc = Start-Core
          $marker = "ci-smoke-$env:GITHUB_RUN_ID"
          $saveBody = @{
            name = $marker
            state = @{
              smoke_marker = $marker
              character = @{ name = 'CI Tester' }
              world = @{ year = 1272; month = 6; day = 17; hour = 22; minute = 0 }
            }
          } | ConvertTo-Json -Depth 10
          $saved = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/save' -ContentType 'application/json' -Body $saveBody
          if (!$saved.ok -or !$saved.id) { throw 'Save creation failed.' }
          $saveId = [int64]$saved.id

          $loaded = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/save/load' -ContentType 'application/json' -Body (@{id=$saveId} | ConvertTo-Json)
          if ($loaded.state.smoke_marker -ne $marker) { throw 'Immediate save load failed.' }

          Stop-Core
          if (!$coreProc.HasExited) { $coreProc.WaitForExit(5000) | Out-Null }

          $coreProc = Start-Core
          $loaded2 = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/save/load' -ContentType 'application/json' -Body (@{id=$saveId} | ConvertTo-Json)
          if ($loaded2.state.smoke_marker -ne $marker) { throw 'Save did not survive Core restart.' }
          Stop-Core
          if (!$coreProc.HasExited) { $coreProc.WaitForExit(5000) | Out-Null }

          Write-Host '==> Simulated update package replacement'
          $staging = Join-Path $env:RUNNER_TEMP 'KronikiRPG-Update-Staging'
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Expand-Archive -Path 'build/KronikiRPG-win-x64.zip' -DestinationPath $staging -Force
          if (!(Test-Path (Join-Path $staging 'KronikiRPG.exe'))) { throw 'Update package missing game exe.' }
          if (!(Test-Path (Join-Path $staging 'kroniki_core.exe'))) { throw 'Update package missing core exe.' }
          Remove-Item -Recurse -Force (Join-Path $installDir 'app')
          Move-Item -Path $staging -Destination (Join-Path $installDir 'app')
          $core = Join-Path $installDir 'app/kroniki_core.exe'
          $game = Join-Path $installDir 'app/KronikiRPG.exe'

          $coreProc = Start-Core
          $loaded3 = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/save/load' -ContentType 'application/json' -Body (@{id=$saveId} | ConvertTo-Json)
          if ($loaded3.state.smoke_marker -ne $marker) { throw 'Save did not survive app update replacement.' }
          Stop-Core
          if (!$coreProc.HasExited) { $coreProc.WaitForExit(5000) | Out-Null }

          Write-Host '==> Godot exported game headless boot'
          $gameProc = Start-Process -FilePath $game -ArgumentList @('--headless','--quit-after','2') -Wait -PassThru
          if ($gameProc.ExitCode -ne 0) { throw "Godot game smoke boot failed with exit code $($gameProc.ExitCode)" }

          if (!(Test-Path (Join-Path $dataDir 'kroniki.sqlite3'))) {
            throw 'Expected persistent SQLite save database was not created.'
          }
          Write-Host 'SMOKE TEST PASSED: install -> core -> save -> restart -> update replacement -> save preserved -> game boot'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: KronikiRPG-0.9.0-preview.2-Windows
          path: |
            kroniki-rpg-godot/build/KronikiRPG-Setup.exe
            kroniki-rpg-godot/build/KronikiRPG-win-x64.zip
            kroniki-rpg-godot/build/update-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Preview GitHub Release
        shell: pwsh
        working-directory: kroniki-rpg-godot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.9.0-preview.2'
          $repo = '${{ github.repository }}'
          $assets = @('build/KronikiRPG-Setup.exe','build/KronikiRPG-win-x64.zip','build/update-manifest.json')
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release asset update failed.' }
          } else {
            gh release create $tag @assets --repo $repo --target '${{ github.sha }}' --title 'Kroniki RPG 0.9.0-preview.2' --notes 'Preview 0.9.0: Core Migration + AI-GM. Automatyczny build Windows z instalatorem, updaterem i testem trwałości zapisów.' --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
          }
          gh release view $tag --repo $repo --json tagName,isPrerelease,url,assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify published GitHub Release.' }

name: Kroniki RPG - Windows Preview Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
        working-directory: source010/current
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source010/current/rust-core
            source010/current/launcher

      - name: Test Rust Core
        run: |
          cargo test --manifest-path rust-core/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Rust Core tests failed' }

      - name: Check launcher
        run: |
          cargo check --manifest-path launcher/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Launcher check failed' }

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe","$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$iscc) { throw 'ISCC.exe not found after install' }
          $iscc.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build 0.10 preview
        run: |
          ./scripts/build_windows_release.ps1 -Version '0.10.0-preview.1' -Channel preview -Repository '${{ github.repository }}' -GodotVersion '4.7.2'

      - name: Verify outputs
        run: |
          $required=@(
            'build/KronikiRPG-Setup.exe',
            'build/KronikiRPG-win-x64.zip',
            'build/update-manifest.json',
            'build/KronikiLauncher.exe',
            'build/app/KronikiRPG.exe',
            'build/app/kroniki_core.exe',
            'build/app/ai/llama-server.exe',
            'build/app/ai/local-ai-profile.json'
          )
          foreach($p in $required){if(!(Test-Path $p)){throw "Missing build output: $p"}}

      - name: Smoke test install save update and autonomous Core
        run: |
          $ErrorActionPreference='Stop'
          $installDir=Join-Path $env:RUNNER_TEMP 'KronikiRPG-010'
          $dataDir=Join-Path $env:LOCALAPPDATA 'KronikiRPG'
          if(Test-Path $installDir){Remove-Item -Recurse -Force $installDir}
          if(Test-Path $dataDir){Remove-Item -Recurse -Force $dataDir}

          $setup=(Resolve-Path 'build/KronikiRPG-Setup.exe').Path
          $p=Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$installDir") -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Installer failed: $($p.ExitCode)"}

          foreach($r in @('KronikiLauncher.exe','app/KronikiRPG.exe','app/kroniki_core.exe','app/ai/llama-server.exe')){
            if(!(Test-Path (Join-Path $installDir $r))){throw "Installed file missing: $r"}
          }

          $core=Join-Path $installDir 'app/kroniki_core.exe'
          $proc=Start-Process -FilePath $core -WorkingDirectory (Split-Path $core) -PassThru
          try {
            $h=$null
            for($i=0;$i -lt 80;$i++){
              try{$h=Invoke-RestMethod 'http://127.0.0.1:17377/health' -TimeoutSec 1;if($h.ok){break}}catch{}
              Start-Sleep -Milliseconds 250
            }
            if(!$h.ok){throw 'Core did not start'}
            if($h.version -ne '0.10.0-preview.1'){throw "Wrong core version $($h.version)"}

            $new=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/campaign/new' -ContentType 'application/json' -Body '{}'
            if(!$new.state.director -or !$new.state.npcs){throw 'Autonomous campaign seed incomplete'}

            $body=@{action='Pash iritor — badam wzburzoną energię tego miejsca.';state=$new.state;use_ai=$false;roll=18}|ConvertTo-Json -Depth 35
            $turn=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/action' -ContentType 'application/json' -Body $body
            if($turn.interpretation.action_type -ne 'magic_attempt'){throw 'Intent interpreter failed'}
            if($turn.mechanics.magic.operation -ne 'sense'){throw 'Free-form magic semantic resolution failed'}
            if(!$turn.director){throw 'Story Director missing'}

            $saved=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/save' -ContentType 'application/json' -Body (@{name='CI 0.10';state=$turn.state}|ConvertTo-Json -Depth 35)
            if(!$saved.ok){throw 'Save failed'}
            $loaded=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/save/load' -ContentType 'application/json' -Body (@{id=$saved.id}|ConvertTo-Json)
            if($loaded.state._meta.save_schema -ne 3){throw 'Save schema mismatch'}

            $tick=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/world/tick' -ContentType 'application/json' -Body (@{minutes=480;reason='sen';state=$loaded.state}|ConvertTo-Json -Depth 35)
            if(!$tick.ok){throw 'World autonomy tick failed'}
          } finally {
            try{Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/shutdown' -ContentType 'application/json' -Body '{}' -TimeoutSec 2|Out-Null}catch{}
            Start-Sleep -Milliseconds 700
            if(!$proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}
          }

          $game=Join-Path $installDir 'app/KronikiRPG.exe'
          $gp=Start-Process -FilePath $game -ArgumentList @('--headless','--quit-after','2') -Wait -PassThru
          if($gp.ExitCode -ne 0){throw "Godot boot failed: $($gp.ExitCode)"}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KronikiRPG-0.10.0-preview.1-Windows
          path: |
            source010/current/build/KronikiRPG-Setup.exe
            source010/current/build/KronikiRPG-win-x64.zip
            source010/current/build/update-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Preview GitHub Release
        shell: pwsh
        working-directory: source010/current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v0.10.0-preview.1'
          $repo='${{ github.repository }}'
          $assets=@('build/KronikiRPG-Setup.exe','build/KronikiRPG-win-x64.zip','build/update-manifest.json')
          gh release view $tag --repo $repo *> $null
          if($LASTEXITCODE -eq 0){
            gh release upload $tag @assets --repo $repo --clobber
          }else{
            gh release create $tag @assets --repo $repo --target '${{ github.sha }}' --title 'Kroniki RPG 0.10.0-preview.1' --notes 'Autonomiczny MGAI: lokalny Qwen3-8B, Story Director, pamięć i relacje NPC, questy/frakcje, free-form magic, alchemia/crafting/hunting i grywalny vertical slice.' --prerelease
          }
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}

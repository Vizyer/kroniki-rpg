name: Kroniki RPG - Windows Preview Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-core
            launcher

      - name: Test Core and launcher
        shell: pwsh
        run: |
          cargo test --manifest-path rust-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust Core tests failed.' }
          cargo check --manifest-path launcher/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Launcher check failed.' }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $inno = @('C:\Program Files (x86)\Inno Setup 6','C:\Program Files\Inno Setup 6') | Where-Object { Test-Path (Join-Path $_ 'ISCC.exe') } | Select-Object -First 1
          if (!$inno) { throw 'ISCC.exe not found.' }
          $inno | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build direct 0.10 release
        shell: pwsh
        run: ./scripts/build_windows_release.ps1 -Version '0.10.0-preview.1' -Channel 'preview' -Repository '${{ github.repository }}' -GodotVersion '4.5.1' -LlamaVersion 'v0.4.1'

      - name: Verify outputs
        shell: pwsh
        run: |
          $required = @('build/KronikiRPG-Setup.exe','build/KronikiRPG-win-x64.zip','build/update-manifest.json','build/KronikiLauncher.exe','build/app/KronikiRPG.exe','build/app/kroniki_core.exe','build/app/ai-runtime/llama-server.exe','build/app/version.json')
          foreach ($p in $required) { if (!(Test-Path $p)) { throw "Missing build output: $p" } }

      - name: Smoke test installed Core and persistent save
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'KronikiRPG-Smoke'
          $dataDir = Join-Path $env:LOCALAPPDATA 'KronikiRPG'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          if (Test-Path $dataDir) { Remove-Item -Recurse -Force $dataDir }
          $p = Start-Process -FilePath (Resolve-Path 'build/KronikiRPG-Setup.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$installDir") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $core = Join-Path $installDir 'app/kroniki_core.exe'
          $game = Join-Path $installDir 'app/KronikiRPG.exe'
          $llama = Join-Path $installDir 'app/ai-runtime/llama-server.exe'
          foreach ($p in @($core,$game,$llama)) { if (!(Test-Path $p)) { throw "Installed file missing: $p" } }
          function Wait-Core { for ($i=0; $i -lt 80; $i++) { try { $h=Invoke-RestMethod -Uri 'http://127.0.0.1:17377/health' -TimeoutSec 1; if ($h.ok) { return $h } } catch {}; Start-Sleep -Milliseconds 250 }; throw 'Core timeout' }
          $cp = Start-Process -FilePath $core -WorkingDirectory (Split-Path $core) -PassThru
          $health = Wait-Core
          if ($health.core -ne '0.10.0') { throw "Wrong core: $($health.core)" }
          if (!$health.local_ai.runtime_present) { throw 'llama runtime not visible to Core' }
          $saved=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/save' -ContentType 'application/json' -Body '{"name":"CI 0.10 smoke"}'
          if (!$saved.ok -or !$saved.id) { throw 'Save failed' }
          $saveId=[int64]$saved.id
          $loaded=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/save/load' -ContentType 'application/json' -Body (@{id=$saveId}|ConvertTo-Json)
          if (!$loaded.ok -or $loaded.state.schema -ne 10) { throw 'Load failed' }
          Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/shutdown' -ContentType 'application/json' -Body '{}' | Out-Null
          Start-Sleep -Seconds 1
          $staging=Join-Path $env:RUNNER_TEMP 'KronikiRPG-Update-Staging'
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          Expand-Archive 'build/KronikiRPG-win-x64.zip' $staging -Force
          Remove-Item -Recurse -Force (Join-Path $installDir 'app')
          Move-Item $staging (Join-Path $installDir 'app')
          $core=Join-Path $installDir 'app/kroniki_core.exe'
          $cp=Start-Process -FilePath $core -WorkingDirectory (Split-Path $core) -PassThru
          $null=Wait-Core
          $loaded2=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/save/load' -ContentType 'application/json' -Body (@{id=$saveId}|ConvertTo-Json)
          if (!$loaded2.ok) { throw 'Save did not survive update' }
          Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:17377/shutdown' -ContentType 'application/json' -Body '{}' | Out-Null
          Start-Sleep -Seconds 1
          $gp=Start-Process -FilePath (Join-Path $installDir 'app/KronikiRPG.exe') -ArgumentList @('--headless','--quit-after','2') -Wait -PassThru
          if ($gp.ExitCode -ne 0) { throw 'Godot boot failed' }
          if (!(Test-Path (Join-Path $dataDir 'kroniki.sqlite3'))) { throw 'SQLite save DB missing' }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KronikiRPG-0.10.0-preview.1-Windows
          path: |
            build/KronikiRPG-Setup.exe
            build/KronikiRPG-win-x64.zip
            build/update-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Preview GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v0.10.0-preview.1'
          $repo='${{ github.repository }}'
          $assets=@('build/KronikiRPG-Setup.exe','build/KronikiRPG-win-x64.zip','build/update-manifest.json')
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag @assets --repo $repo --clobber } else { gh release create $tag @assets --repo $repo --target '${{ github.sha }}' --title 'Kroniki RPG 0.10.0-preview.1' --notes 'Autonomous AI-GM foundation, direct Rust/Godot build, bundled llama.cpp runtime, optional Qwen3-8B model.' --prerelease }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
